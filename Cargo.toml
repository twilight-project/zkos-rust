[workspace]
resolver = "2"
members = [
    "address",
    "merkle",
    "mulmsgsig",
    "rangeproof",
    "readerwriter",
    "starsig",
    "transaction",
    "transactionapi",
    "utxo-in-memory",
    "zkvm",
    "chain-oracle"
]

[workspace.package]
version = "0.1.2"  # Sync with git tag v0.1.2
license = "Apache-2.0"
authors = ["Twilight Project Contributors"]
repository = "https://github.com/twilight-project/zkos-rust"
edition = "2021"
rust-version = "1.80"

# Shared cryptographic dependencies (used by most crates)
[workspace.dependencies]
# Core cryptography
curve25519-dalek = { version = "4", default-features = false, features = ["serde", "rand_core", "alloc", "precomputed-tables"] }
bulletproofs = { git = "https://github.com/dalek-cryptography/bulletproofs.git", rev = "04bce4e66013ff857ed462fd4206210544101461", features = ["yoloproofs"] }
merlin = { version = "3", default-features = false }
subtle = "2"

# Random number generation
rand = "0.8"
rand_core = { version = "0.6", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1"
serde_bytes = "0.11.9"

# Error handling
thiserror = "1"

# Utilities
hex = "0.4"
byteorder = "1"
sha3 = "0.10"
sha2 = { version = "0.10", default-features = false }
bs58 = "0.4.0"
ripemd = "0.1.3"
subtle-encoding = "0.5.1"

# External git dependencies (shared across workspace)
quisquis-rust = { git = "https://github.com/twilight-project/quisquis-rust.git", tag = "v0.1.2-rc1" }
zkschnorr = { git = "https://github.com/twilight-project/zk-schnorr.git", tag = "v0.2.0" }