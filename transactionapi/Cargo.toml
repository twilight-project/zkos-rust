[package]
name = "transactionapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

description = "ZkOS Transaction API for blockchain interaction and UTXO management"
repository.workspace = true
readme = "README.md"
keywords = ["blockchain", "zkos", "rpc", "api", "utxo"]
categories = ["api-bindings", "blockchain"]
publish = false

# documentation = "https://docs.rs/transactionapi"
# license, repository, authors inherited from [workspace.package]

[[bin]]
name = "api_server"

[dependencies]
# shared dependencies from workspace
curve25519-dalek.workspace = true
merlin.workspace = true
serde.workspace = true  # Remove serde_derive, use serde with derive feature
serde_json.workspace = true
hex.workspace = true
sha3.workspace = true
bincode.workspace = true

# crate specific dependencies
dotenv = "0.15.0"
jsonrpc = "0.12.1"
jsonrpc-http-server = "18.0"
jsonrpc-core = "18.0.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
lazy_static = "1.4.0"
tokio = { version = "1", features = ["full"] }
prometheus = "0.12"
rocket = "0.5.0"
ctrlc = "3.1.9"
jsonrpsee = "0.16.2"
getrandom = { version = "0.2", default-features = false, features = ["js"] }
uuid = { version = "0.8.2", features = ["v4", "serde"] }

# tendermint-rpc = "0.28.0"
# check bitcoin core rpc 

[dependencies.nyks-wallet]
git = "https://github.com/twilight-project/nyks-wallet"
tag = "v0.1.0"
default-features = false
features = ["validator-wallet"]

[dependencies.quisquis-rust]
workspace = true

[dependencies.bulletproofs]
workspace = true

[dependencies.transaction]
path = "../transaction"

[dependencies.utxo-in-memory]
path = "../utxo-in-memory"

[dependencies.address]
path = "../address"

[dependencies.zkvm]
path = "../zkvm"

[features]
default = []
nightly = ["curve25519-dalek/alloc"]
