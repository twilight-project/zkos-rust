[package]
name = "readerwriter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Binary reader/writer traits and utilities for serialization and cryptographic transcripts. Based on Stellar's Slingshot project."
repository.workspace = true
readme = "README.md"
keywords = ["reader", "writer", "serialization", "binary", "merlin"]
categories = ["cryptography", "data-structures"]
publish = false

# documentation = "https://docs.rs/"
# license, repository, authors inherited from [workspace.package]

[dependencies]
bytes = { version = "0.5.4", optional = true }
merlin = { workspace = true, optional = true }

[features]
default = []
merlin = ["dep:merlin"]  # This enables the optional merlin dependency
bytes = ["dep:bytes"]    # This enables the optional bytes dependency