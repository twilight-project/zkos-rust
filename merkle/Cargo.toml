[package]
name = "merkle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Efficient, generic Merkle tree utilities for cryptographic applications."
repository.workspace = true
readme = "README.md"
keywords = ["merkle", "tree", "cryptography", "hash", "proof"]
categories = ["cryptography", "data-structures"]
publish = false

# documentation = "https://docs.rs/merkle"
# license, repository, authors inherited from [workspace.package]

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
merlin.workspace = true
hex.workspace = true
subtle.workspace = true
readerwriter = { path = "../readerwriter" }
address = { path = "../address" }

[badges]
maintenance = { status = "experimental" }

